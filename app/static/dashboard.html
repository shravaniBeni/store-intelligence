<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Intelligence Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #637083;
      --line: #dde3ea;
      --accent: #1666c5;
      --warn: #b26000;
      --critical: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input,
    button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 10px;
    }

    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    main {
      padding: 22px 0 32px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 14px;
    }

    .cards,
    .grid {
      display: grid;
      gap: 12px;
    }

    .cards {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 12px;
    }

    .grid {
      grid-template-columns: 1fr 1fr;
    }

    .card,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .value {
      margin-top: 8px;
      font-size: 30px;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .bar {
      height: 8px;
      width: 100%;
      overflow: hidden;
      border-radius: 999px;
      background: #eef2f6;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }

    .chart {
      margin-bottom: 14px;
    }

    .svg-chart {
      display: block;
      width: 100%;
      height: auto;
    }

    .svg-label {
      color: var(--muted);
      fill: var(--muted);
      font-size: 12px;
    }

    .svg-value {
      fill: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .svg-track {
      fill: #eef2f6;
    }

    .svg-fill {
      fill: var(--accent);
    }

    .svg-fill-secondary {
      fill: #2f8f6f;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--accent);
    }

    .legend-swatch.secondary {
      background: #2f8f6f;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      background: #eef2f6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .badge.WARN {
      background: #fff3df;
      color: var(--warn);
    }

    .badge.CRITICAL {
      background: #fde8e6;
      color: var(--critical);
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .topbar,
      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      .cards,
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <h1>Store Intelligence Dashboard</h1>
      <div class="controls">
        <input id="storeId" aria-label="Store ID" value="ST1008">
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="status" class="status">Loading store metrics...</div>

    <section class="cards" aria-label="Summary metrics">
      <div class="card">
        <div class="label">Visitors</div>
        <div id="visitors" class="value">-</div>
      </div>
      <div class="card">
        <div class="label">Conversion</div>
        <div id="conversion" class="value">-</div>
      </div>
      <div class="card">
        <div class="label">Queue depth</div>
        <div id="queueDepth" class="value">-</div>
      </div>
      <div class="card">
        <div class="label">Anomalies</div>
        <div id="anomalyCount" class="value">-</div>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Funnel stages</h2>
        <div id="funnelChart" class="chart"></div>
        <table>
          <thead>
            <tr>
              <th>Stage</th>
              <th>Count</th>
              <th>Dropoff</th>
            </tr>
          </thead>
          <tbody id="funnelRows"></tbody>
        </table>
      </div>

      <div class="panel">
        <h2>Heatmap zones</h2>
        <div id="zoneChart" class="chart"></div>
        <table>
          <thead>
            <tr>
              <th>Zone</th>
              <th>Visits</th>
              <th>Avg dwell</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="heatmapRows"></tbody>
        </table>
      </div>

      <div class="panel">
        <h2>Active anomalies</h2>
        <table>
          <thead>
            <tr>
              <th>Severity</th>
              <th>Type</th>
              <th>Suggested action</th>
            </tr>
          </thead>
          <tbody id="anomalyRows"></tbody>
        </table>
      </div>

      <div class="panel">
        <h2>Dwell by zone</h2>
        <table>
          <thead>
            <tr>
              <th>Zone</th>
              <th>Dwell</th>
            </tr>
          </thead>
          <tbody id="dwellRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const storeInput = document.getElementById("storeId");
    const REFRESH_INTERVAL_MS = 8000;
    let isLoading = false;

    function pct(value) {
      return `${Math.round((Number(value) || 0) * 1000) / 10}%`;
    }

    function ms(value) {
      const seconds = Math.round((Number(value) || 0) / 1000);
      return `${seconds}s`;
    }

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    function setRows(id, rows, render, emptyMessage) {
      const tbody = document.getElementById(id);
      tbody.innerHTML = "";
      if (!rows.length) {
        const tr = document.createElement("tr");
        const td = cell(emptyMessage);
        td.colSpan = 4;
        td.className = "empty";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }
      rows.forEach((row) => tbody.appendChild(render(row)));
    }

    function emptyChart(id, message) {
      const chart = document.getElementById(id);
      chart.innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = message;
      chart.appendChild(empty);
    }

    function renderFunnelChart(stages) {
      const chart = document.getElementById("funnelChart");
      chart.innerHTML = "";
      if (!stages.length) {
        emptyChart("funnelChart", "No funnel data");
        return;
      }
      const rowHeight = 34;
      const height = stages.length * rowHeight + 10;
      const svg = makeSvg(640, height);
      const maxCount = Math.max(...stages.map((stage) => Number(stage.count) || 0), 1);
      stages.forEach((stage, index) => {
        const y = index * rowHeight + 8;
        const count = Number(stage.count) || 0;
        const width = Math.max(3, Math.round((count / maxCount) * 420));
        svg.append(svgText(stage.stage, 0, y + 17, "svg-label"));
        svg.append(svgRect(130, y, 420, 18, "svg-track"));
        svg.append(svgRect(130, y, width, 18, "svg-fill"));
        svg.append(svgText(String(stage.count ?? 0), 565, y + 17, "svg-value"));
      });
      chart.append(svg);
    }

    function renderZoneChart(zones) {
      const chart = document.getElementById("zoneChart");
      chart.innerHTML = "";
      if (!zones.length) {
        emptyChart("zoneChart", "No heatmap data");
        return;
      }
      const legend = document.createElement("div");
      legend.className = "chart-legend";
      legend.append(legendItem("Visit score", "legend-swatch"));
      legend.append(legendItem("Avg dwell", "legend-swatch secondary"));
      chart.append(legend);

      const rowHeight = 42;
      const height = zones.length * rowHeight + 10;
      const svg = makeSvg(640, height);
      const maxDwell = Math.max(...zones.map((zone) => Number(zone.avg_dwell_ms) || 0), 1);
      zones.forEach((zone, index) => {
        const y = index * rowHeight + 7;
        const visitWidth = Math.max(3, Math.round(((Number(zone.normalized_score) || 0) / 100) * 360));
        const dwellWidth = Math.max(3, Math.round(((Number(zone.avg_dwell_ms) || 0) / maxDwell) * 360));
        svg.append(svgText(zone.zone_id, 0, y + 19, "svg-label"));
        svg.append(svgRect(150, y, 360, 12, "svg-track"));
        svg.append(svgRect(150, y, visitWidth, 12, "svg-fill"));
        svg.append(svgRect(150, y + 17, 360, 12, "svg-track"));
        svg.append(svgRect(150, y + 17, dwellWidth, 12, "svg-fill-secondary"));
        svg.append(svgText(`${zone.visit_frequency ?? 0} visits`, 525, y + 11, "svg-value"));
        svg.append(svgText(ms(zone.avg_dwell_ms), 525, y + 28, "svg-label"));
      });
      chart.append(svg);
    }

    function legendItem(label, swatchClass) {
      const item = document.createElement("span");
      const swatch = document.createElement("span");
      const text = document.createElement("span");
      item.className = "legend-item";
      swatch.className = swatchClass;
      text.textContent = label;
      item.append(swatch, text);
      return item;
    }

    function makeSvg(width, height) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "svg-chart");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-hidden", "true");
      return svg;
    }

    function svgRect(x, y, width, height, className) {
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", width);
      rect.setAttribute("height", height);
      rect.setAttribute("rx", 4);
      rect.setAttribute("class", className);
      return rect;
    }

    function svgText(text, x, y, className) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", "text");
      node.setAttribute("x", x);
      node.setAttribute("y", y);
      node.setAttribute("class", className);
      node.textContent = text ?? "";
      return node;
    }

    async function getJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`${url} returned ${response.status}`);
      }
      return response.json();
    }

    async function loadDashboard() {
      if (isLoading) {
        return;
      }
      isLoading = true;
      const storeId = storeInput.value.trim() || "ST1008";
      statusEl.textContent = `Loading ${storeId}...`;
      try {
        const [metrics, funnel, heatmap, anomalies] = await Promise.all([
          getJson(`/stores/${encodeURIComponent(storeId)}/metrics`),
          getJson(`/stores/${encodeURIComponent(storeId)}/funnel`),
          getJson(`/stores/${encodeURIComponent(storeId)}/heatmap`),
          getJson(`/stores/${encodeURIComponent(storeId)}/anomalies`),
        ]);

        document.getElementById("visitors").textContent = metrics.unique_visitors ?? "-";
        document.getElementById("conversion").textContent = pct(metrics.conversion_rate);
        document.getElementById("queueDepth").textContent = metrics.queue_depth ?? "-";
        document.getElementById("anomalyCount").textContent = anomalies.active_anomalies?.length ?? 0;

        renderFunnelChart(funnel.stages || []);
        setRows("funnelRows", funnel.stages || [], (stage) => {
          const tr = document.createElement("tr");
          tr.append(cell(stage.stage));
          tr.append(cell(stage.count));
          tr.append(cell(pct(stage.dropoff_from_previous)));
          return tr;
        }, "No funnel data");

        renderZoneChart(heatmap.zones || []);
        setRows("heatmapRows", heatmap.zones || [], (zone) => {
          const tr = document.createElement("tr");
          tr.append(cell(zone.zone_id));
          tr.append(cell(zone.visit_frequency));
          tr.append(cell(ms(zone.avg_dwell_ms)));
          const score = document.createElement("td");
          const bar = document.createElement("div");
          const fill = document.createElement("span");
          bar.className = "bar";
          fill.style.width = `${Math.max(0, Math.min(100, Number(zone.normalized_score) || 0))}%`;
          bar.appendChild(fill);
          score.appendChild(bar);
          tr.append(score);
          return tr;
        }, "No heatmap data");

        setRows("anomalyRows", anomalies.active_anomalies || [], (anomaly) => {
          const tr = document.createElement("tr");
          const severity = document.createElement("td");
          const badge = document.createElement("span");
          badge.className = `badge ${anomaly.severity || ""}`;
          badge.textContent = anomaly.severity || "INFO";
          severity.appendChild(badge);
          tr.append(severity);
          tr.append(cell(anomaly.type));
          tr.append(cell(anomaly.suggested_action));
          return tr;
        }, "No active anomalies");

        const dwellRows = Object.entries(metrics.avg_dwell_per_zone_ms || {}).map(([zone, dwell]) => ({ zone, dwell }));
        setRows("dwellRows", dwellRows, (row) => {
          const tr = document.createElement("tr");
          tr.append(cell(row.zone));
          tr.append(cell(ms(row.dwell)));
          return tr;
        }, "No dwell data");

        statusEl.textContent = `Updated ${new Date().toLocaleTimeString()} for ${storeId}`;
      } catch (error) {
        statusEl.textContent = `Dashboard load failed: ${error.message}`;
      } finally {
        isLoading = false;
      }
    }

    document.getElementById("refresh").addEventListener("click", loadDashboard);
    loadDashboard();
    window.setInterval(loadDashboard, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
